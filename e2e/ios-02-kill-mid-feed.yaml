# iPhone: close the app mid feed for over a minute and reopen it. The timer must have kept counting
# from the stored start time. (The simulator uses the Mac's clock, so the "an hour later" check runs
# in the unit tests instead.) The timer is read by VoiceOver as "Fed for 1 minute", which is what is checked.
appId: com.philipnader.nuzzle
---
- launchApp
- tapOn:
    id: "side-L"
- assertVisible: "Feeding on the left"
- assertVisible:
    id: "timer"
    text: "Fed for just now"
- stopApp
# about 70 seconds with the app closed
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 70000
    optional: true
- launchApp
- assertVisible: "Feeding on the left"
- assertVisible:
    id: "timer"
    text: "Fed for 1 minute"
- takeScreenshot: night-08-home-running-after-reopening
- tapOn:
    id: "done"
- assertVisible: "Ended on the left"
- extendedWaitUntil:
    visible:
      id: "reminder-at"
    timeout: 10000
