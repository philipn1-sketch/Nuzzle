# Main flow: first launch, start, switch, pause, carry on, stop, Undo, stop again, reminder on.
appId: com.philipnader.nuzzle
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: "No feeds yet"
- takeScreenshot: night-01-home-first-launch
- tapOn:
    id: "side-L"
- assertVisible: "Feeding on the left"
- assertVisible: "Started on the left."
- takeScreenshot: night-02-home-started
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Started on the left."
    timeout: 10000
- tapOn:
    id: "side-R"
- assertVisible: "Feeding on the right"
- assertVisible: "Tap to pause"
- assertNotVisible: "Started on the left."
- extendedWaitUntil:
    visible:
      id: "side-R"
      text: ".*0:0[1-9].*"
    timeout: 5000
- takeScreenshot: night-03-home-running
- tapOn:
    id: "side-R"
- assertVisible: "Paused on the right"
- assertVisible: "Carry on here"
- takeScreenshot: night-04-home-paused
- tapOn:
    id: "side-L"
- assertVisible: "Feeding on the left"
- tapOn:
    id: "done"
- assertVisible:
    text: "Saved.*ended on the left."
- takeScreenshot: night-05-home-just-saved
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "snack-undo"
- assertVisible: "Feeding on the left"
- tapOn:
    id: "done"
- assertVisible: "Ended on the left"
- assertVisible: "Start here"
- extendedWaitUntil:
    visible:
      text: "Want a reminder.*"
    timeout: 12000
- takeScreenshot: night-06-home-ask-reminders
- tapOn:
    id: "reminders-on"
- extendedWaitUntil:
    visible:
      id: "reminder-at"
    timeout: 10000
- takeScreenshot: night-07-home-idle
