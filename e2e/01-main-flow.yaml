# Main flow: first launch, start, switch, pause, carry on, stop, Undo, stop again, reminder on.
appId: com.philipnader.nuzzle
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      visible:
        id: "welcome-skip"
    commands:
      - tapOn:
          id: "welcome-skip"
- assertVisible: "No feeds yet"
- takeScreenshot: night-01-home-first-launch
- tapOn:
    id: "side-L"
- assertVisible:
    id: "timer"
    text: "Feeding on the left.*"
- assertVisible:
    id: "feed-state"
    text: "this feed"
- takeScreenshot: night-02-home-started
- tapOn:
    id: "side-R"
- assertVisible:
    id: "timer"
    text: "Feeding on the right.*"
- assertVisible:
    id: "side-R"
    text: ".*Tap to pause.*"
- takeScreenshot: night-03-home-running
- tapOn:
    id: "side-R"
- assertVisible:
    id: "feed-state"
    text: "Paused"
- assertVisible:
    id: "side-R"
    text: ".*Carry on here.*"
- takeScreenshot: night-04-home-paused
- tapOn:
    id: "side-L"
- assertVisible:
    id: "timer"
    text: "Feeding on the left.*"
- tapOn:
    id: "done"
- assertVisible:
    text: "Saved.*ended on the left."
- takeScreenshot: night-05-home-just-saved
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "snack-undo"
- assertVisible:
    id: "timer"
    text: "Feeding on the left.*"
- tapOn:
    id: "done"
- assertVisible:
    id: "last-side"
    text: "Last feed.*"
- assertVisible:
    id: "side-R"
    text: ".*Start here.*"
- extendedWaitUntil:
    visible:
      text: "Remind you when the next feed is due.*"
    timeout: 12000
- takeScreenshot: night-06-home-ask-reminders
- tapOn:
    id: "reminders-on"
- extendedWaitUntil:
    visible:
      id: "reminder-at"
    timeout: 10000
- takeScreenshot: night-07-home-idle
