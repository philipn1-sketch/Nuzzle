# History, edit, delete with Undo, add a forgotten feed, settings, then the day theme.
appId: com.philipnader.nuzzle
---
- launchApp
- tapOn:
    id: "open-history"
- assertVisible: "History"
- assertVisible: "Today.*"
- takeScreenshot: night-09-history
- tapOn:
    id: "feed-row-.*"
    index: 0
- assertVisible: "Edit feed"
- takeScreenshot: night-10-edit-feed
# the feeds from the earlier flows are only minutes old; move this one to yesterday so 15 minutes fits
- tapOn:
    id: "day-less"
- tapOn:
    id: "left-value"
- inputText: "15"
- takeScreenshot: night-10b-edit-feed-typing
- tapOn:
    id: "save-feed"
- assertVisible: "Feed updated."
- assertVisible: ".*left 15 minutes.*"
- tapOn:
    id: "feed-row-.*"
    index: 0
- tapOn:
    id: "delete-feed"
- assertVisible: "Feed deleted."
- takeScreenshot: night-11-history-just-deleted
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "snack-undo"
- tapOn:
    id: "add-feed"
- assertVisible: "Add a feed"
- tapOn:
    id: "save-feed"
- assertVisible: "Add some minutes on at least one side."
- takeScreenshot: night-12-add-feed-problem
- tapOn:
    id: "right-more"
- tapOn:
    id: "right-more"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "time-less"
- tapOn:
    id: "save-feed"
- tapOn:
    id: "back"
- tapOn:
    id: "open-settings"
- assertVisible: "Settings"
- takeScreenshot: night-13-settings
- scrollUntilVisible:
    element:
      id: "choice-day"
    direction: DOWN
- tapOn:
    id: "choice-day"
- takeScreenshot: day-13-settings
- tapOn:
    id: "back"
- takeScreenshot: day-07-home-idle
- tapOn:
    id: "open-history"
- takeScreenshot: day-09-history
- tapOn:
    id: "choice-week"
- assertVisible: "Time on the breast"
- takeScreenshot: day-14-week
- tapOn:
    id: "back"
- tapOn:
    id: "log-bottle"
- assertVisible: "Log a bottle"
- tapOn:
    id: "amount-more"
- tapOn:
    id: "save-feed"
- assertVisible: "Bottle added.*"
- assertVisible: ".*Bottle 100 ml.*"
- takeScreenshot: day-15-home-after-bottle
- tapOn:
    id: "log-nappy"
- tapOn:
    id: "nappy-both"
- assertVisible: "Wet and dirty nappy at.*"
- assertVisible:
    id: "nappies-today"
- tapOn:
    id: "log-sleep"
- assertVisible:
    id: "asleep"
- takeScreenshot: day-16-home-asleep
- tapOn:
    id: "woke-up"
- assertVisible: "Awake.*"
- tapOn:
    id: "side-L"
- takeScreenshot: day-03-home-running
- tapOn:
    id: "discard"
- assertVisible: "Feed discarded."
# Siri and the Shortcuts app open these links
- openLink: "nuzzle://action?do=R"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "timer"
    timeout: 10000
- assertVisible: "Feeding on the right"
- openLink: "nuzzle://action?do=R"
- assertVisible: "Feeding on the right"
# a feed under five seconds is treated as a mistap, so let it run a little
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 6000
    optional: true
- openLink: "nuzzle://action?do=done"
- extendedWaitUntil:
    visible: "Ended on the right"
    timeout: 10000
