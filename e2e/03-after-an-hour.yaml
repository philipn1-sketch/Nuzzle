# After the app was killed and the clock moved on an hour: the timer must still be right.
appId: com.philipnader.nuzzle
---
- launchApp
- assertVisible: "Feeding on the left"
- assertVisible:
    id: "timer"
    text: "1:0[0-9]:[0-9]{2}"
- takeScreenshot: night-08-home-running-after-an-hour
- tapOn:
    id: "done"
- assertVisible: "Ended on the left"
- assertVisible:
    text: "Reminder at.*"
